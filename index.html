<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI마법사 묵호를 추억하다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FBF2E3;
    --paper-deep:#F3E6CF;
    --ink:#4A3527;
    --sea:#2E5266;
    --sea-deep:#1F3A47;
    --seafoam:#8FC1BA;
    --sunset:#E8825A;
    --mustard:#E3A857;
    --mural-pink:#E8A0A0;
    --cherry:#E8637E;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    overflow-x:hidden;
  }

  body{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 5vh 4vw 4vh;
    background-image:
      radial-gradient(ellipse at 15% 10%, rgba(232,160,160,0.20), transparent 45%),
      radial-gradient(ellipse at 85% 15%, rgba(143,193,186,0.25), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(227,168,87,0.18), transparent 55%);
  }

  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    opacity:0.05; mix-blend-mode:multiply;
  }

  header{
    position:relative;
    text-align:center;
    z-index:2;
    margin-bottom: 0.3rem;
  }

  .title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    animation: titlePop 1s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes titlePop{
    0%{ opacity:0; transform: scale(0.85) translateY(8px); }
    100%{ opacity:1; transform: scale(1) translateY(0); }
  }
  .sparkle{ width: 22px; height:22px; flex-shrink:0; opacity:0.9; animation: twinkle 2.4s ease-in-out infinite; }
  .sparkle.s2{ animation-delay: .8s; }
  @keyframes twinkle{
    0%,100%{ opacity:0.4; transform: scale(0.85) rotate(0deg); }
    50%{ opacity:1; transform: scale(1.1) rotate(12deg); }
  }

  h1{
    font-family:'Nanum Pen Script', cursive;
    font-weight:400;
    font-size: clamp(2.4rem, 7vw, 4rem);
    margin: 0;
    letter-spacing: 0.5px;
    line-height:1.15;
    background: linear-gradient(100deg, var(--cherry), var(--sunset) 55%, var(--mustard));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 2px 3px 0 rgba(46,82,102,0.08);
  }

  .quote{
    font-family:'Nanum Pen Script', cursive;
    font-size: clamp(1.2rem, 2.4vw, 1.55rem);
    color: var(--sea-deep);
    margin: 0.35rem 0 0.5rem;
    opacity: 0.85;
  }

  .wave-wrap{
    width: min(560px, 80vw);
    height: 24px;
    overflow:hidden;
    position:relative;
    margin: 0.2rem auto 1.2rem;
    opacity:0.8;
  }
  .wave-track{
    position:absolute; top:0; left:0;
    width:200%; height:100%;
    display:flex;
    animation: waveDrift 9s linear infinite;
  }
  .wave-track svg{ width:50%; height:100%; flex-shrink:0; }
  @keyframes waveDrift{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  main{
